name: Build Bubbles for Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'Info.plist'
      - 'Scripts/**'
      - '.github/workflows/build-apple-silicon.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build native ARM64 app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Confirm Apple Silicon runner
        run: |
          sw_vers
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Show Swift version
        run: swift --version

      - name: Build, test and package
        run: |
          chmod +x Scripts/package_apple_silicon.sh
          ./Scripts/package_apple_silicon.sh

      - name: Upload Apple Silicon DMG
        uses: actions/upload-artifact@v4
        with:
          name: Bubbles-Autoclicker-Apple-Silicon-DMG
          path: dist/Bubbles-Autoclicker-Apple-Silicon.dmg
          if-no-files-found: error

      - name: Upload Apple Silicon APP ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Bubbles-Autoclicker-Apple-Silicon-App
          path: dist/Bubbles-Autoclicker-Apple-Silicon.zip
          if-no-files-found: error
